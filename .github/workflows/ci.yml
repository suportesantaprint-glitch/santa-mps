name: CI - Santa MPS

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Next.js MVP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Check project files
        run: |
          test -f package.json || {
            echo "::error::package.json não encontrado."
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json não encontrado."
            echo "Gere o lockfile com: npm install"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Validate package metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          if (!pkg.name) throw new Error('package.json precisa de "name".');
          if (!pkg.version) throw new Error('package.json precisa de "version".');

          const scripts = pkg.scripts || {};
          const required = ['lint', 'typecheck', 'test', 'build', 'e2e'];
          const missing = required.filter((name) => !scripts[name]);

          if (missing.length) {
            throw new Error(
              'Scripts obrigatórios ausentes no package.json: ' + missing.join(', ')
            );
          }

          if (!pkg.dependencies?.next && !pkg.devDependencies?.next) {
            throw new Error('Next.js não encontrado nas dependências.');
          }

          if (!pkg.devDependencies?.['@playwright/test'] && !pkg.dependencies?.['@playwright/test']) {
            throw new Error('@playwright/test não encontrado nas dependências.');
          }

          console.log('package.json validado.');
          console.log('Next.js:', pkg.dependencies?.next || pkg.devDependencies?.next);
          console.log('Playwright:', pkg.devDependencies?.['@playwright/test'] || pkg.dependencies?.['@playwright/test']);
          NODE

      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build

  e2e:
    name: E2E - Playwright
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
